name: bgmi_server_glitch
description: Android/iOS app for BGMI Server Glitch - Multi-Key Server Access System

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0

  # Networking
  http: ^1.1.0

  # Authentication
  google_sign_in: ^6.1.0
  firebase_auth: ^4.7.0
  firebase_core: ^2.13.0

  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.3

  # UI/UX
  intl: ^0.18.1
  lottie: ^2.4.0
  flutter_spinkit: ^5.2.0

  # Notifications
  flutter_local_notifications: ^14.1.0

  # Analytics
  firebase_analytics: ^10.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Courier
      fonts:
        - asset: assets/fonts/courier.ttf
